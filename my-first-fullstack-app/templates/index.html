<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Full-Stack App</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>My First Full-Stack App</h1>

        <p class="subtitle">
            Enter two numbers and let the back-end calculate their sum.
        </p>

        <div class="calculator">

            <label for="num1">First Number</label>
            <input type="number" id="num1" placeholder="Enter first number"
                   step="any">

            <label for="num2">Second Number</label>
            <input type="number" id="num2" placeholder="Enter second number"
                   step="any">

            <button id="calculateBtn">Calculate Sum</button>

            <div id="result" aria-live="polite">
                Your result will appear here.
            </div>

        </div>

        <p class="footer">
            Built using HTML, CSS, JavaScript and Python Flask.
        </p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
